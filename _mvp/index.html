<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Still Listening</title>
<style>
  :root {
    --bg: #fdf6ec;
    --ink: #2b2417;
    --parent: #b78cde;
    --parent-bubble: #efe1fb;
    --kid: #f3c969;
    --kid-bubble: #fdf0c9;
    --muted: #8a7d6b;
    --line: #d8cdb6;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Iowan Old Style', 'Georgia', serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 18px 22px 14px;
    border-bottom: 1px dashed var(--line);
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    background: #fbf2e2;
  }
  .brand {
    font-size: 12px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .title {
    font-size: 22px;
    font-weight: 600;
    line-height: 1.2;
  }
  .mode-toggle {
    display: flex;
    gap: 4px;
    background: #ece2cf;
    border-radius: 999px;
    padding: 4px;
  }
  .mode-toggle button {
    background: transparent;
    border: none;
    padding: 7px 16px;
    border-radius: 999px;
    font-family: inherit;
    cursor: pointer;
    color: var(--muted);
    font-size: 14px;
  }
  .mode-toggle button.active {
    background: white;
    color: var(--ink);
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }
  main {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }
  .bubble {
    padding: 14px 18px;
    border-radius: 18px;
    max-width: 85%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    line-height: 1.55;
    position: relative;
  }
  .bubble .who {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .bubble.voice {
    background: var(--parent-bubble);
    align-self: flex-start;
    border-left: 4px solid var(--parent);
  }
  .bubble.branch {
    background: var(--kid-bubble);
    align-self: flex-end;
    border-right: 4px solid var(--kid);
    text-align: right;
  }
  .play {
    margin-top: 10px;
    background: var(--parent);
    color: white;
    border: none;
    padding: 6px 14px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
  }
  .play:hover { filter: brightness(0.95); }
  footer {
    border-top: 1px dashed var(--line);
    padding: 16px 20px 22px;
    background: #f7eeda;
  }
  .actions { max-width: 720px; margin: 0 auto; }
  .prompt {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .choices { display: grid; gap: 10px; }
  .choices button {
    background: white;
    border: 1px solid #e2d6bc;
    padding: 12px 16px;
    border-radius: 14px;
    text-align: left;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
    color: var(--ink);
    line-height: 1.4;
    transition: all 0.15s;
  }
  .choices button:hover {
    border-color: var(--kid);
    background: #fffaeb;
    transform: translateX(2px);
  }
  .record-row {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .record-row input {
    flex: 1;
    min-width: 180px;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid #e2d6bc;
    font-family: inherit;
    font-size: 15px;
    background: white;
  }
  .record-btn {
    padding: 10px 20px;
    border-radius: 999px;
    border: none;
    background: var(--parent);
    color: white;
    font-family: inherit;
    font-size: 15px;
    cursor: pointer;
  }
  .record-btn.recording {
    background: #c64a4a;
    animation: pulse 1.2s infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(198,74,74,0.5); }
    50% { box-shadow: 0 0 0 10px rgba(198,74,74,0); }
  }
  .reset {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
    text-decoration: underline;
    margin-top: 12px;
    font-family: inherit;
  }
  .empty-hint {
    color: var(--muted);
    font-size: 13px;
    margin-top: 6px;
    font-style: italic;
  }
</style>
</head>
<body>
  <header>
    <div>
      <div class="brand">Still Listening</div>
      <div class="title" id="storyTitle">The Garden with the Purple Door</div>
    </div>
    <div class="mode-toggle">
      <button id="kidMode" class="active">Kid</button>
      <button id="parentMode">Parent</button>
    </div>
  </header>
  <main id="timeline"></main>
  <footer>
    <div class="actions" id="actions"></div>
  </footer>

<script>
const BRANCHES = [
  "Suddenly, a friendly badger poked its head out of the bushes.",
  "The wind blew, and a paper map drifted down from the sky.",
  "A tiny door appeared on the side of an old oak tree.",
  "Everything started to glow softly, like fireflies waking up.",
  "A small voice giggled from somewhere nearby.",
  "The grass turned bright blue, just for a moment.",
  "A path of smooth river stones stretched ahead.",
  "An old woman with a kind smile waved from a porch.",
  "It started to rain marshmallows. Just a few.",
  "A cat with one green eye and one blue eye trotted past.",
  "Something shiny twinkled near a tree root.",
  "The clouds rearranged themselves to spell a word.",
  "A breeze carried the smell of warm bread from somewhere.",
  "A small rabbit dropped a tiny envelope at their feet.",
  "The path forked — one way bright, one way mossy and cool."
];

const SEED = {
  title: "The Garden with the Purple Door",
  nodes: [{
    id: 'seed-1',
    type: 'voice',
    who: 'Mom',
    text: "Once upon a time, there was a garden tucked behind an old stone wall. At the very back of the garden, hidden by a curtain of ivy, there was a tiny purple door — just the right size for a kid your age. Nobody knew where it went. One sunny afternoon, you decided you wanted to find out.",
    ts: Date.now()
  }]
};

let state = load() || structuredClone(SEED);
let mode = 'kid';
let mediaRecorder = null;
let recordedChunks = [];
let currentChoices = [];

function save() { localStorage.setItem('still-listening', JSON.stringify(state)); }
function load() {
  try { return JSON.parse(localStorage.getItem('still-listening')); }
  catch { return null; }
}

function render() {
  document.getElementById('storyTitle').textContent = state.title;
  const tl = document.getElementById('timeline');
  tl.innerHTML = '';
  for (const n of state.nodes) {
    const b = document.createElement('div');
    b.className = 'bubble ' + (n.type === 'voice' ? 'voice' : 'branch');
    const who = document.createElement('div');
    who.className = 'who';
    who.textContent = n.who || (n.type === 'voice' ? 'Parent' : 'You');
    b.appendChild(who);
    const body = document.createElement('div');
    body.textContent = n.text;
    b.appendChild(body);
    if (n.type === 'voice') {
      const play = document.createElement('button');
      play.className = 'play';
      play.textContent = n.audio ? '▶  Play recording' : '▶  Hear it read';
      play.onclick = () => playNode(n);
      b.appendChild(play);
    }
    tl.appendChild(b);
  }
  tl.scrollTop = tl.scrollHeight;
  renderActions();
}

function playNode(n) {
  speechSynthesis.cancel();
  if (n.audio) {
    new Audio(n.audio).play();
  } else if (n.text) {
    const u = new SpeechSynthesisUtterance(n.text);
    u.rate = 0.92;
    u.pitch = 1.05;
    speechSynthesis.speak(u);
  }
}

function renderActions() {
  const a = document.getElementById('actions');
  a.innerHTML = '';
  if (mode === 'kid') {
    const p = document.createElement('div');
    p.className = 'prompt';
    p.textContent = 'Your turn — what happens next?';
    a.appendChild(p);
    const c = document.createElement('div');
    c.className = 'choices';
    if (currentChoices.length === 0) currentChoices = pickChoices();
    for (const choice of currentChoices) {
      const btn = document.createElement('button');
      btn.textContent = choice;
      btn.onclick = () => addBranch(choice);
      c.appendChild(btn);
    }
    a.appendChild(c);
    const reset = document.createElement('button');
    reset.className = 'reset';
    reset.textContent = 'Start the story over';
    reset.onclick = () => {
      if (confirm('Reset the story? (Recordings will be cleared.)')) {
        state = structuredClone(SEED);
        currentChoices = [];
        save();
        render();
      }
    };
    a.appendChild(reset);
  } else {
    const p = document.createElement('div');
    p.className = 'prompt';
    p.textContent = 'Record the next part of the story';
    a.appendChild(p);
    const row = document.createElement('div');
    row.className = 'record-row';
    const input = document.createElement('input');
    input.placeholder = 'Whose voice? (Mom, Dad…)';
    input.id = 'whoInput';
    input.value = 'Mom';
    row.appendChild(input);
    const btn = document.createElement('button');
    btn.className = 'record-btn';
    btn.id = 'recBtn';
    btn.textContent = '● Record';
    btn.onclick = toggleRecord;
    row.appendChild(btn);
    a.appendChild(row);
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.textContent = 'Tap record, tell the next chapter, tap stop. Your kid will see it next time they open the story.';
    a.appendChild(hint);
  }
}

function pickChoices() {
  return [...BRANCHES].sort(() => Math.random() - 0.5).slice(0, 3);
}

function addBranch(text) {
  state.nodes.push({
    id: 'b-' + Date.now(),
    type: 'branch',
    who: 'You',
    text,
    ts: Date.now()
  });
  currentChoices = pickChoices();
  save();
  render();
}

async function toggleRecord() {
  const btn = document.getElementById('recBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];
    mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordedChunks, { type: 'audio/webm' });
      const dataUrl = await blobToDataUrl(blob);
      const who = (document.getElementById('whoInput').value || 'Parent').trim();
      state.nodes.push({
        id: 'v-' + Date.now(),
        type: 'voice',
        who,
        text: '(' + who + ' recorded the next part of the story.)',
        audio: dataUrl,
        ts: Date.now()
      });
      save();
      render();
      stream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();
    btn.textContent = '■  Stop';
    btn.classList.add('recording');
  } catch (err) {
    alert('Could not access microphone: ' + err.message);
  }
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onloadend = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

document.getElementById('kidMode').onclick = () => {
  mode = 'kid';
  document.getElementById('kidMode').classList.add('active');
  document.getElementById('parentMode').classList.remove('active');
  renderActions();
};
document.getElementById('parentMode').onclick = () => {
  mode = 'parent';
  document.getElementById('parentMode').classList.add('active');
  document.getElementById('kidMode').classList.remove('active');
  renderActions();
};

render();
</script>
</body>
</html>
